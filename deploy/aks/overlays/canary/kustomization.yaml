# Branch canary → namespace gaer-terminalsupport-canary
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gaer-terminalsupport-canary
resources:
  - ../../base
images:
  - name: gaer
    newName: msops.azurecr.io/gaer-terminalsupport-canary
    newTag: latest
patches:
  - target:
      kind: Ingress
      name: gaer
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: gaer-terminalsupport-canary.cluster1.nexi-ms-ops-nordics.net
