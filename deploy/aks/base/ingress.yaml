# Caddy ingress on msops1 (*.cluster1.nexi-ms-ops-nordics.net points at it); the overlays set the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaer
  labels:
    app: gaer
  annotations:
    kubernetes.io/ingress.class: caddy
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gaer
                port:
                  number: 80
