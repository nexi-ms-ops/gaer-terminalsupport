# The one Gær container. The init container migrates the database (advisory lock, so replicas never race),
# then the app starts. Settings come from the secret "gaer-env" (see deploy/aks/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaer
  labels:
    app: gaer
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gaer
  template:
    metadata:
      labels:
        app: gaer
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: gaer
          imagePullPolicy: Always
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - secretRef:
                name: gaer-env
          env: &env
            - name: GAER_ENV
              value: production
            - name: TRUST_PROXY
              value: "1"
            - name: STORAGE_BACKEND
              value: azure
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts: &mounts
            - name: tmp
              mountPath: /tmp
      containers:
        - name: app
          image: gaer
          # The tag is :latest for now; the workflow restarts the deployment so new pods pull the new image
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: gaer-env
          env: *env
          securityContext: *securityContext
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts: *mounts
      volumes:
        # Zip unpacking and GDPR exports write temporary files
        - name: tmp
          emptyDir:
            sizeLimit: 12Gi
