name: aks-deploy
# Reusable: build the one image, push it to ACR (msops.azurecr.io) as :latest (plus the commit sha, for a manual
# rollback) and roll it out to the namespace on msops1 without downtime: the deployment surges one new pod, which
# migrates the database (init container) and must pass /health before the old pod stops.
# Azure login is OIDC (managed identity id-gaer-terminalsupport-github, federated per GitHub environment).

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      overlay:
        type: string
        required: true
      namespace:
        type: string
        required: true
      image:
        type: string
        required: true
      host:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: msops.azurecr.io
  AKS_RESOURCE_GROUP: kubernetes
  AKS_CLUSTER: msops1

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ inputs.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push to ACR
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ inputs.image }}
        run: |
          az acr login --name "${REGISTRY%%.*}"
          docker build --build-arg GAER_VERSION=${GITHUB_SHA::7} -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"

      - uses: azure/setup-kubectl@v4

      - name: Roll out
        env:
          NS: ${{ inputs.namespace }}
        run: |
          az aks get-credentials -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER" --overwrite-existing
          kubectl apply -k "deploy/aks/overlays/${{ inputs.overlay }}"
          # Same :latest tag, so restart to pull it; maxUnavailable 0 keeps the old pod serving until the new is ready
          kubectl -n "$NS" annotate deployment/gaer kubernetes.io/change-cause="$GITHUB_SHA" --overwrite
          kubectl -n "$NS" rollout restart deployment/gaer
          if ! kubectl -n "$NS" rollout status deployment/gaer --timeout=10m; then
            kubectl -n "$NS" get pods -l app=gaer
            kubectl -n "$NS" logs -l app=gaer --all-containers --tail=100 --prefix || true
            exit 1
          fi

      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ inputs.host }}/health"
