name: aks-main
# Push to main → gaer-terminalsupport on msops1 (https://gaer-terminalsupport.cluster1.nexi-ms-ops-nordics.net)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: aks-main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/aks-deploy.yml
    with:
      environment: production
      overlay: main
      namespace: gaer-terminalsupport
      image: gaer-terminalsupport
      host: gaer-terminalsupport.cluster1.nexi-ms-ops-nordics.net
