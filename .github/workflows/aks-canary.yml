name: aks-canary
# Push to canary → gaer-terminalsupport-canary on msops1 (https://gaer-terminalsupport-canary.cluster1.nexi-ms-ops-nordics.net)

on:
  push:
    branches: [canary]
  workflow_dispatch:

concurrency: aks-canary

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/aks-deploy.yml
    with:
      environment: canary
      overlay: canary
      namespace: gaer-terminalsupport-canary
      image: gaer-terminalsupport-canary
      host: gaer-terminalsupport-canary.cluster1.nexi-ms-ops-nordics.net
